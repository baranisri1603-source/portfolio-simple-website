<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Barani</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="page-body">
    <main class="contact-page container">
      <header class="page-header">
        <h1>Contact Me</h1>
        <a href="index.html" class="btn secondary">Back to Portfolio</a>
      </header>

      <section class="contact-layout">
        <form class="contact-form">
          <div class="form-row">
            <label for="first-name">First Name</label>
            <input id="first-name" type="text" placeholder="Enter your name" />
          </div>
          <div class="form-row">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Enter your email" />
          </div>
          <div class="form-row">
            <label for="message">Message</label>
            <textarea id="message" rows="5" placeholder="Write your message here"></textarea>
          </div>
          <button type="submit" class="btn primary">Submit</button>
        </form>

        <table class="info-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Message</th>
              <th>Social Media</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Barani</td>
              <td>Baranisti1698@gmail.com</td>
              <td>Hello, I'm Barani!</td>
              <td>
                <a href="https://www.linkedin.com/in/barani-g-674212248" target="_blank" rel="noreferrer">
                  LinkedIn
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
